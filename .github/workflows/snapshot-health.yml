# Turns silent logger failure into a loud one.
#
# A failing workflow notifies you, but the dangerous cases are quiet: a schedule that
# GitHub skipped, or a job that ran and wrote nothing. Lost trajectory is unrecoverable -
# it is the one part of the dataset that cannot be backfilled - so this asserts the open
# window is actually accumulating snapshots and fails the run if it is not.
#
# Daily rather than weekly: a weekly check can let breakage run for six days, which would
# cost most of a gameweek's trajectory.

name: Snapshot health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *" # daily, offset off the hour

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: .data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install pandas requests pyarrow

      - name: Check the open window is being logged
        env:
          PYTHONPATH: ${{ github.workspace }}
          FPL_SNAPSHOT_DIR: ${{ github.workspace }}/.data/snapshots
        run: python run/snapshot_market.py --health
