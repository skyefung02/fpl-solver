# Logs the FPL transfer market to the orphan `data` branch.
#
# One hourly cron is all that is scheduled. Densification near the deadline is handled
# inside the job by --watch, because deadlines move between gameweeks (GW4 is Saturday
# 12:30Z, not the usual 17:30Z) and cron cannot track that. Once a job starts it polls on
# its own clock, so the tightest sampling lands where the flow curve is steepest even if
# the cron tick itself drifted.
#
# Cron drift (5-30 min late, occasionally skipped) is harmless here: the counters are
# cumulative, so the next successful run reports the full running total.
#
# Requires Settings -> Actions -> General -> Workflow permissions = "Read and write".
# The `data` branch is created automatically on first run if it does not exist.

name: Market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # hourly, offset off the hour to dodge peak-load cron drift

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # --watch can hold the job for up to --max-runtime (50 min)
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out (or create) the data branch
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git clone --depth 1 --branch data "$REPO" .data 2>/dev/null; then
            echo "Cloned existing data branch."
          else
            echo "No data branch yet - creating an orphan one."
            git clone --depth 1 "$REPO" .data
            cd .data
            git checkout --orphan data
            git rm -rf . > /dev/null 2>&1 || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install pandas requests pyarrow

      - name: Take snapshots
        env:
          PYTHONPATH: ${{ github.workspace }}
          FPL_SNAPSHOT_DIR: ${{ github.workspace }}/.data/snapshots
        run: python run/snapshot_market.py --watch --top 5

      # The .latest.json marker is committed alongside the parts: every run is a fresh
      # checkout, so without it the unchanged-payload guard has nothing to compare against.
      - name: Commit to the data branch
        working-directory: .data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new snapshots to commit (payload unchanged)."
          else
            git commit -m "market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data
          fi
